[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microverse"
version = "1.0.0"
description = "Multiverse analysis of microbiome differential abundance, behind a URL."
requires-python = ">=3.11"
license = { text = "MIT" }
# Read from requirements.txt rather than repeated here. The host installs this
# project to build the function and takes the dependency list from this table, so an
# empty one is a deployment that builds cleanly and then cannot import FastAPI. Two
# copies of the list would drift; one of them would be the one the host reads.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# The host installs this project to build the function, which makes setuptools go
# looking for packages. Left to guess, its flat-layout discovery finds seven
# candidates at the top level -- api, app, data, deploy, docs, examples, tests --
# and refuses rather than choose. Only `app` is importable at runtime, so only `app`
# is declared. This is packaging metadata; nothing here affects what the code does.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".venv310", "data", "docs"]

[tool.ruff.lint]
select = ["F", "E", "W", "B", "SIM", "UP", "C4", "RET", "ARG", "I"]
ignore = [
  # FastAPI's dependency-injection defaults are function calls by design.
  "B008",
  # An explicit if/else is clearer than a ternary in the places we use one.
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures and modules for their side effects, and assert on values
# that a linter reads as unused.
"tests/*" = ["ARG001", "ARG005"]
# The reference scripts run standalone against other environments, so they set up
# sys.path before importing and print rather than assert.
"tests/reference/*" = ["E402", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/reference/ holds standalone comparison scripts, not pytest tests: they need a
# second interpreter, a live server or a network fetch. Run them via
# tests/reference/run_all.py.
norecursedirs = ["reference", ".*", "build", "dist", "data", "docs"]
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:fastapi.*",
]

# Vercel imports this module at build time, reads the subscription it registers, and
# compiles it into a queue-triggered function. Without this entry a queued run is
# published successfully and never delivered, so tests/test_queue_mode.py asserts it.
[[tool.vercel.subscribers]]
entrypoint = "app.queue_worker"
