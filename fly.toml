# Fly.io — SPEC §20. `fly launch --no-deploy` then `fly deploy`.
#
# MicroVerse is more compute-hungry than a typical web server: a Quick-mode run at the
# §8 taxon ceiling takes ~25 s of CPU (docs/benchmark.json). Size the machine for that
# rather than for request concurrency, and let the in-process queue (app/limits.py)
# bound how many run at once.
app = "microverse"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  MICROVERSE_DATA = "/data"
  # Match the queue to the vCPU count below.
  MICROVERSE_MAX_CONCURRENT = "2"
  MICROVERSE_MAX_QUEUED = "24"

[[mounts]]
  source = "microverse_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
